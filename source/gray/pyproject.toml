[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gray"
version = "0.1.0"
description = "Gray Medical Computing Laboratory computer-vision framework template"
requires-python = ">=3.10"
dependencies = ["hydra-core>=1.3", "numpy>=1.26", "pydicom>=3.0", "rich>=13.7", "scipy>=1.11"]

[project.optional-dependencies]
clearml = ["clearml>=1.16"]

[project.scripts]
gray = "gray.cli:main"

[tool.setuptools]
package-dir = {"gray" = "."}
packages = [
  "gray",
  "gray.callbacks",
  "gray.core",
  "gray.dicom",
  "gray.experiment",
  "gray.inference",
  "gray.nnunet",
  "gray.preprocess",
  "gray.runtime",
  "gray.utils",
]
