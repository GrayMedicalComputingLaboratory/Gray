[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gray"
version = "0.1.0"
description = "Gray Medical Computing Laboratory computer-vision framework template"
requires-python = ">=3.10"
dependencies = ["SimpleITK>=2.3", "hydra-core>=1.3", "numpy>=1.26", "rich>=13.7"]

[project.optional-dependencies]
clearml = ["clearml>=1.16"]

[project.scripts]
gray = "gray.cli:main"

[tool.setuptools]
package-dir = {"" = "source"}

[tool.setuptools.packages.find]
where = ["source"]
include = ["gray*"]
