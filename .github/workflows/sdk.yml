name: Python inference SDK

on:
  push:
    paths: ['source/gray/**', 'tests/**', 'examples/sdk/**', 'build_sdk.py', '.github/workflows/sdk.yml']
  pull_request:
    paths: ['source/gray/**', 'tests/**', 'examples/sdk/**', 'build_sdk.py', '.github/workflows/sdk.yml']

permissions:
  contents: read

jobs:
  cpu-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install './source/gray[sdk-dev]'
      - run: ruff check --isolated source/gray/sdk tests/test_sdk.py examples/sdk build_sdk.py
      - run: python -m pytest tests -q
      - run: python build_sdk.py
      - name: Install and test wheel independently of source
        run: |
          python -m venv /tmp/gray-sdk-wheel
          /tmp/gray-sdk-wheel/bin/python -m pip install './dist/sdk/gray-0.1.0-py3-none-any.whl[sdk]'
          cd /tmp
          /tmp/gray-sdk-wheel/bin/python "$GITHUB_WORKSPACE/examples/sdk/run_inference.py"
          /tmp/gray-sdk-wheel/bin/gray-sdk info --model "$GITHUB_WORKSPACE/examples/sdk/model"
      - uses: actions/upload-artifact@v4
        with:
          name: gray-sdk-python-${{ matrix.python }}
          path: dist/sdk/*.whl
